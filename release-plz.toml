# release-plz configuration.
#
# Independent per-crate versioning is release-plz's default (it is NOT lockstep,
# unlike release-please's rust strategy that broke us). Each crate bumps on its
# own commits, and release-plz updates the internal [workspace.dependencies] pin
# automatically when molecular-annotation changes.

[workspace]
# Only open a release PR when there is a feat or fix. By default release-plz
# releases on ANY commit (chore/docs/ci included, as a patch); this restricts it
# to meaningful changes. Breaking changes use feat!/fix!, which still match.
release_commits = "^(feat|fix)[(:!]"
# release-plz finds "its" open release PR by head-branch prefix only, with no
# base-branch filter (opened_prs in release_plz_core). main uses the default
# "release-plz-", so a run on this branch would grab main's 0.14.x release PR
# and force-push 0.13.x content onto it (that happened to #132 on 2026-09-18).
# A prefix that does not start with "release-plz-" or "release-plz/" keeps the
# two branches' release PRs apart in both directions.
pr_branch_prefix = "release-v0.13-"
# The release-plz action installs cargo-semver-checks, so the check runs unless
# turned off here, and it must be set in this [workspace] table to apply to
# every package. It builds both the current source and the published baseline
# from a fresh registry resolution without any Cargo.lock. The baseline is
# immutable, and the 0.13.0 crate no longer resolves to a buildable set (vergen
# 9.1.0 vs vergen-git2 1.x), so the check can never pass again for that
# baseline. Once 0.13.1 is the newest published version, the baseline resolves
# fresh again and this can be turned back on. Conventional-commit bumping is
# what we rely on meanwhile.
semver_check = false

[[package]]
name = "fibertools-rs"
git_tag_name = "v{{ version }}"          # keep v0.X.Y (matches existing tags + cargo-dist)
git_release_draft = true                 # draft so cargo-dist attaches binaries, then un-drafts
features_always_increment_minor = true   # feat -> minor even on 0.x
# Prepend an install section (the cargo-dist shell installer) to the changelog
# in the GitHub release body. {{ version }} is the release version; the tag is
# v{{ version }} and the installer asset is fibertools-rs-installer.sh.
git_release_body = """
## Install

Prebuilt binaries are attached below. Quick install (Linux/macOS):

```sh
curl --proto '=https' --tlsv1.2 -LsSf https://github.com/fiberseq/fibertools-rs/releases/download/v{{ version }}/fibertools-rs-installer.sh | sh
```

{{ changelog }}
"""

[[package]]
name = "molecular-annotation"
git_tag_name = "molecular-annotation-v{{ version }}"
# git_release_draft defaults false -> MA release is published immediately
#   (it ships no binaries, so nothing would un-draft it).
# features_always_increment_minor defaults false -> keeps MA low (feat -> patch).

